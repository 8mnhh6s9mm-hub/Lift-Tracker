<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f27;--mute:#6b7280;--line:#e2e5ea;--acc:#1f5fd6;--acc-t:#fff;--ok:#16794a;--hi:#e8f0fe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1c2028;--text:#eceff4;--mute:#9aa3b2;--line:#2c313c;--acc:#6ea0ff;--acc-t:#0b1220;--ok:#5fd39b;--hi:#232c42}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1c2028;--text:#eceff4;--mute:#9aa3b2;--line:#2c313c;--acc:#6ea0ff;--acc-t:#0b1220;--ok:#5fd39b;--hi:#232c42}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 130px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.chips{display:flex;gap:8px;margin:10px 0 12px}
.chip{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font-size:15px;font-weight:600}
.chip.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sr{color:var(--acc);font-weight:700;white-space:nowrap}
.tip{color:var(--mute);font-size:13px;margin:2px 0 6px}
.last{font-size:13px;margin-bottom:8px}
.inp{display:flex;gap:8px}.s{margin-bottom:6px;align-items:center}.s span{width:18px;color:var(--mute)}
input,select,textarea{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:17px}
button{font:inherit}
.save{padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:var(--acc-t);font-weight:700}
.wide{width:100%;margin-top:4px}.save.done{background:var(--ok);color:#fff}
.rm{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;padding:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;color:var(--mute);font-weight:600;padding:4px 6px}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
.up{color:var(--ok);font-weight:700}
.sched{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line)}
.sched:first-child{border-top:0}.sched.today{background:var(--hi);border-radius:10px;font-weight:700}
ul{margin:0;padding-left:20px}li{margin-bottom:6px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.field input{flex:0 0 140px;text-align:right}
.reset{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:#c0392b;font-weight:600;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mute);font-weight:600;font-size:12px}
nav button.on{color:var(--acc)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--acc-t);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
#timer[hidden]{display:none}#timer button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px}
</style>
</head>
<body>
<main id="app"></main>
<div id="timer" hidden><span></span><button data-skip="1">Skip</button></div>
<nav id="nav"></nav>
<script>
var DAYS={
Push:[["Bench press","4 x 6-8","Chest, front shoulders, triceps. Lower to mid-chest, press up.",5],
["Incline dumbbell press","3 x 8-10","Upper chest. Bench at a low incline.",5],
["Overhead press","3 x 8-10","Shoulders. Squeeze glutes, don’t lean back.",5],
["Lateral raises","3 x 12-15","Side shoulders. Light weight, no swinging.",2.5],
["Triceps pushdown","3 x 10-12","Keep elbows pinned to your sides.",2.5]],
Pull:[["Pull-ups or lat pulldown","4 x 6-10","Lats. Pull elbows down toward your hips.",5],
["Barbell or cable row","3 x 8-10","Mid back. Pull to lower ribs, back flat.",5],
["Face pulls","3 x 12-15","Rear shoulders and posture.",2.5],
["Barbell curl","3 x 8-10","Biceps. No swinging.",2.5],
["Hammer curl","2 x 10-12","Biceps and forearms.",2.5]],
Legs:[["Squat","4 x 6-8","Quads and glutes. Hips to at least parallel.",5],
["Romanian deadlift","3 x 8-10","Hamstrings. Push hips back, soft knees.",5],
["Leg press","3 x 10-12","Quads.",10],
["Leg curl","3 x 10-12","Hamstrings.",5],
["Calf raise","3 x 12-15","Pause at the top, stretch at the bottom.",5],
["Hanging knee raises","3 x 10-12","Abs. Log reps instead of weight.",0]]};
var SCHED=[["Monday","Push",1],["Tuesday","Cardio: easy swim or incline walk",2],["Wednesday","Pull",3],["Thursday","Cardio: keep it easy",4],["Friday","Legs + abs",5],["Saturday","Optional: free day or swim",6],["Sunday","Rest",0]];
var RULES=["Warm up: 5 min easy cardio, then 1-2 light sets of your first lift.","Stop each set 1-2 reps before you can’t do another rep.","Hit the top of the rep range on every set? Add 5 lb next time (2.5 on small lifts).","Rest 2-3 min on heavy lifts, 60-90 sec on small ones.","Keep cardio days easy so they don’t hurt your next lift.","Eat your protein target and sleep 7-9 hours.","Joints aching or lifts dropping 2 weeks in a row? Take an extra rest day."];
DAYS.Free=[];
var hN=30;
var ALT={"Bench press":["Dumbbell bench press","Machine chest press","Push-ups"],"Incline dumbbell press":["Incline machine press","Incline barbell press","Low-to-high cable fly"],"Overhead press":["Dumbbell shoulder press","Machine shoulder press","Arnold press"],"Lateral raises":["Cable lateral raise","Machine lateral raise","Dumbbell upright row"],"Triceps pushdown":["Overhead cable extension","Skull crushers","Bench dips"],"Pull-ups or lat pulldown":["Assisted pull-ups","Single-arm cable pulldown","Machine high row"],"Barbell or cable row":["Dumbbell row","Machine row","Chest-supported row"],"Face pulls":["Reverse pec deck","Band pull-aparts","Rear delt dumbbell fly"],"Barbell curl":["Dumbbell curl","Cable curl","EZ-bar curl"],"Hammer curl":["Cross-body hammer curl","Rope cable curl","Preacher curl"],"Squat":["Hack squat","Goblet squat","Leg press"],"Romanian deadlift":["Dumbbell Romanian deadlift","Hip thrust","Good morning"],"Leg press":["Hack squat","Goblet squat","Walking lunges"],"Leg curl":["Seated leg curl","Stability ball curl","Nordic curl"],"Calf raise":["Seated calf raise","Leg press calf raise","Single-leg calf raise"],"Hanging knee raises":["Cable crunch","Ab wheel","Decline sit-up"]};
var S={log:{},extra:{},body:[],bw:170,ppl:0.8};
try{var p0=JSON.parse(localStorage.getItem("lt2")||"null");if(p0&&p0.log)S=p0}catch(e){}
S.extra=S.extra||{};S.body=S.body||[];
function save(){try{localStorage.setItem("lt2",JSON.stringify(S))}catch(e){}}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){var a=d.split("-");return +a[1]+"/"+ +a[2]}
function wd(s){return new Date(s+"T12:00:00").getDay()}
var TODAY=ds(new Date()),cur=TODAY,PL={1:"Push",3:"Pull",5:"Legs"};
var tab="work",sel=PL[wd(cur)]||"Push",armed=false,pick=null,tmr=null;
function exList(d){return DAYS[d].map(function(x){var a=S.swap&&S.swap[x[0]];return a?[a,x[1],x[2],x[3]||2.5,false,x[0]]:x}).concat((S.extra[d]||[]).map(function(n){return [n,"Extra","Your own exercise",5,true]}))}
function unit(n){return /knee|wheel|sit-up|push-up|plank/i.test(n)?"reps":"lb"}
function sets(e){return e.sets||[{w:e.w}]}
function topW(e){return Math.max.apply(null,sets(e).map(function(s){return +s.w||0}))}
function e1(s){return s.r?s.w*(1+s.r/30):+s.w||0}
function best1(e){return Math.max.apply(null,sets(e).map(e1))}
function rmLine(n){var l=S.log[n]||[];if(unit(n)==="reps"||!l.some(function(e){return sets(e).some(function(s){return s.r})}))return "";return '<p class="sub" style="margin:8px 0 0">Best est. 1RM: <b>'+Math.round(Math.max.apply(null,l.map(best1)))+' lb</b></p>'}
function wk(d){var x=new Date(d+"T12:00:00"),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return ds(x)}
function days(){var o={};Object.keys(S.log).forEach(function(n){S.log[n].forEach(function(e){o[e.d]=1})});return Object.keys(o).sort()}
function weekInfo(){var g=S.goal||3,c={};days().forEach(function(d){var k=wk(d);c[k]=(c[k]||0)+1});var k=wk(TODAY),now=c[k]||0,st=now>=g?1:0,x=new Date(k+"T12:00:00");for(var i=0;i<200;i++){x.setDate(x.getDate()-7);if((c[ds(x)]||0)>=g)st++;else break}return {now:now,g:g,st:st}}
function dayOf(n){var D=["Push","Pull","Legs","Free"];for(var i=0;i<4;i++)if(exList(D[i]).some(function(x){return x[0]===n}))return D[i];return "Free"}
function hist(){
  var A=days().reverse(),L=A.slice(0,hN),h='<h1>History</h1><p class="sub">All your past workouts, newest first. Tap Open to view or edit a day.</p>';
  if(!L.length)return h+'<p class="sub">Nothing logged yet.</p>';
  L.forEach(function(d){var rows='',first=null;
    Object.keys(S.log).forEach(function(n){var e=ent(n,d);if(!e)return;first=first||n;
      rows+='<div class="row" style="margin-top:4px"><span>'+n+(e.pr?' 🏆':'')+'</span><span style="color:var(--mute);text-align:right">'+sets(e).map(function(s){return s.w+(s.r?"x"+s.r:"")}).join(", ")+'</span></div>'});
    h+='<div class="card"><div class="row"><b>'+new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+'</b><button class="rm" data-open="'+d+'" data-ex="'+first+'">Open</button></div>'+rows+'</div>'});
  if(A.length>L.length)h+='<button class="reset" style="color:var(--acc)" data-more="1">Show more ('+(A.length-L.length)+' older)</button>';
  return h;
}
function plates(){var t=parseFloat($("pcw").value),b=parseFloat($("pcb").value)||45,o=$("pco");
  if(isNaN(t)){o.innerHTML="<b>Enter a weight.</b>";return}
  var r=(t-b)/2;if(r<0){o.innerHTML="<b>That is lighter than the bar.</b>";return}
  var out=[];[45,35,25,10,5,2.5].forEach(function(p){while(r>=p-1e-9){out.push(p);r-=p}});
  o.innerHTML="<b>Per side: "+(out.length?out.join(" + "):"just the bar")+"</b>"+(r>0.01?"<br>Closest loadable weight is "+(t-2*r)+" lb.":"")}
function ent(n,d){return (S.log[n]||[]).filter(function(e){return e.d===d})[0]}
function prev(n,d){var l=(S.log[n]||[]).filter(function(e){return e.d<d});return l[l.length-1]}
function parse(sr){var m=/^(\d+) x (\d+)(?:-(\d+))?/.exec(sr);return m?{n:+m[1],r:+(m[3]||m[2])}:{n:3,r:0}}
function info(ex){
  var e=prev(ex[0],cur);if(!e)return "No earlier session. Start light and log it.";
  var ss=sets(e),P=parse(ex[1]),u=unit(ex[0]);P.n=nsets(ex)||P.n;
  var txt=ss.map(function(s){return s.w+(s.r?"x"+s.r:"")}).join(", ");
  var ok=P.r&&ss.length>=P.n&&ss.every(function(s){return +s.r>=P.r});
  var nx=u==="reps"?"add a rep or two":ok?"try "+(topW(e)+ex[3])+" lb":"same weight, get more reps";
  var rm=u==="lb"&&ss.some(function(s){return s.r})?" · Est. 1RM "+Math.round(best1(e))+" lb":"";return "Last ("+fmt(e.d)+"): <b>"+txt+"</b> · Next: "+nx+rm;
}
function nsets(ex){return (S.setn&&S.setn[ex[0]])||0}
function rowHtml(i,k,u,s){return '<div class="inp s"><span>'+(k+1)+'</span><input type="number" inputmode="decimal" id="w'+i+'_'+k+'" placeholder="'+(u==="reps"?"reps":"lb")+'" value="'+(s.w==null?"":s.w)+'">'+(u==="reps"?'':'<input type="number" inputmode="numeric" id="r'+i+'_'+k+'" placeholder="reps" value="'+(s.r==null?"":s.r)+'">')+'</div>'}
function card(ex,i){
  var P=parse(ex[1]),e=ent(ex[0],cur),ss=e?sets(e):[],n=nsets(ex)||Math.max(P.n,ss.length),u=unit(ex[0]);
  var h='<div class="card"><div class="row"><b>'+ex[0]+'</b><span class="sr">'+ex[1]+'</span></div><div class="tip">'+ex[2]+(ex[4]?' · <button class="rm" data-rm="'+ex[0]+'">Remove</button>':' · <button class="rm" data-swap="'+i+'">Swap</button>'+(ex[5]?' · <button class="rm" data-undo="'+ex[5]+'">Undo swap</button>':''))+'</div><div id="sw'+i+'"></div><div class="last" id="l'+i+'">'+info(ex)+'</div>';
  h+='<div id="rows'+i+'">';
  for(var k=0;k<n;k++)h+=rowHtml(i,k,u,ss[k]||{});
  h+='</div><div class="inp" style="margin-bottom:8px"><button class="chip" data-less="'+i+'">- Set</button><button class="chip" data-add="'+i+'">+ Set</button></div>';
  return h+'<button class="save wide" data-save="'+i+'">'+(e?"Update":"Save")+'</button></div>';
}
function work(){
  var W=weekInfo(),h='<h1>Workout</h1><div class="card"><div class="row"><span>This week</span><b>'+W.now+' of '+W.g+' workouts</b></div><div class="row"><span>Streak</span><b>'+W.st+(W.st===1?' week':' weeks')+' 🔥</b></div></div><div class="field"><span>Date</span><input type="date" id="dt" value="'+cur+'"></div><p class="sub">'+(PL[wd(cur)]?"Scheduled: "+PL[wd(cur)]+" day.":"No lifting scheduled this day. Pick one below.")+' Enter weight and reps for each set.</p><div class="chips">';
  ["Push","Pull","Legs","Free"].forEach(function(d){h+='<button class="chip'+(d===sel?" on":"")+'" data-day="'+d+'">'+d+'</button>'});
  h+='</div>';
  if(sel==="Free"&&!exList(sel).length)h+='<p class="sub">Free day: build your own workout. Add any exercises below. Names you have used before autocomplete, and they share progress with the same lift on other days.</p>';
  exList(sel).forEach(function(ex,i){h+=card(ex,i)});
  return h+'<h2>'+(sel==="Free"?"Add an exercise":"Add another exercise")+'</h2><div class="card"><div class="inp"><input type="text" id="nn" list="exl" placeholder="Exercise name"><button class="save" id="addx">Add</button></div><datalist id="exl">'+allNames().map(function(n){return '<option value="'+n+'">'}).join("")+'</datalist></div><h2>Plate calculator</h2><div class="card"><div class="field"><span>Target weight (lb)</span><input type="number" inputmode="decimal" id="pcw"></div><div class="field"><span>Bar weight (lb)</span><input type="number" inputmode="decimal" id="pcb" value="45"></div><p id="pco" style="margin:0"><b>Enter a weight.</b></p></div>';
}
function plantab(){
  var h='<h1>Weekly plan</h1><p class="sub">3 lifting days, cardio in between.</p><div class="card" style="padding:4px">';
  SCHED.forEach(function(s){h+='<div class="sched'+(s[2]===wd(TODAY)?" today":"")+'"><span>'+s[0]+'</span><span>'+s[1]+'</span></div>'});
  h+='</div><h2>Rules</h2><div class="card"><ul>';
  RULES.forEach(function(r){h+='<li>'+r+'</li>'});
  return h+'</ul></div>';
}
function chart(pts,u){
  if(pts.length<2)return '<p class="sub">Log at least 2 entries to see a chart.</p>';
  var W=330,H=120,xs=pts.map(function(p){return new Date(p[0]).getTime()}),ys=pts.map(function(p){return p[1]});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  if(y1===y0){y1++;y0--}if(x1===x0)x1++;
  var P=pts.map(function(p,i){return (10+(xs[i]-x0)/(x1-x0)*(W-20)).toFixed(1)+","+(H-18-(p[1]-y0)/(y1-y0)*(H-36)).toFixed(1)}).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><polyline points="'+P+'" fill="none" stroke="var(--acc)" stroke-width="2.5"/><text x="10" y="12" fill="var(--mute)" font-size="11">'+y1+u+'</text><text x="10" y="'+(H-4)+'" fill="var(--mute)" font-size="11">'+y0+u+'</text></svg>';
}
function allNames(){var n=[];Object.keys(DAYS).forEach(function(d){DAYS[d].forEach(function(x){n.push(x[0])})});Object.keys(S.extra).forEach(function(d){S.extra[d].forEach(function(x){if(n.indexOf(x)<0)n.push(x)})});Object.keys(S.swap||{}).forEach(function(k){var a=S.swap[k];if(n.indexOf(a)<0)n.push(a)});return n}
function prog(){
  var names=allNames();pick=pick||names[0];
  var o=names.map(function(n){return '<option'+(n===pick?" selected":"")+'>'+n+'</option>'}).join("");
  var pts=(S.log[pick]||[]).map(function(e){return [e.d,topW(e)]});
  var h='<h1>Progress</h1><p class="sub">Top weight per session.</p><div class="card"><select id="pk" style="width:100%;margin-bottom:8px">'+o+'</select>'+chart(pts,unit(pick)==="reps"?"":" lb")+rmLine(pick)+'</div><div class="card"><table class="tbl"><tr><th>Lift</th><th>Start</th><th>Now</th><th>Gain</th></tr>',n=0,t=0;
  names.forEach(function(x){var l=S.log[x]||[];t++;
    if(!l.length){h+='<tr><td>'+x+'</td><td>-</td><td>-</td><td>-</td></tr>';return}
    var a=topW(l[0]),b=topW(l[l.length-1]),g=Math.round((b-a)*10)/10;if(g>0)n++;
    h+='<tr><td>'+x+'</td><td>'+a+'</td><td>'+b+'</td><td class="'+(g>0?"up":"")+'">'+(g>0?"+":"")+g+'</td></tr>';});
  return h+'</table></div><p class="sub">'+n+' of '+t+' lifts improved.</p>';
}
function body(){
  var b=S.body.slice().sort(function(a,c){return a.d<c.d?-1:1}),e=b.filter(function(x){return x.d===TODAY})[0]||{};
  var h='<h1>Body</h1><p class="sub">Weigh in each morning. Measure your waist at the navel once a week.</p><div class="card"><div class="field"><span>Date</span><input type="date" id="bd" value="'+TODAY+'"></div><div class="field"><span>Weight (lb)</span><input type="number" inputmode="decimal" id="bwt" value="'+(e.w||"")+'"></div><div class="field"><span>Waist (in)</span><input type="number" inputmode="decimal" id="bwa" value="'+(e.waist||"")+'"></div><button class="save wide" data-bsave="1">Save</button></div>';
  h+='<h2>Weight</h2><div class="card">'+chart(b.filter(function(x){return x.w}).map(function(x){return [x.d,x.w]})," lb")+'</div><h2>Waist</h2><div class="card">'+chart(b.filter(function(x){return x.waist}).map(function(x){return [x.d,x.waist]}),' in')+'</div>';
  h+='<div class="card"><table class="tbl"><tr><th>Date</th><th>Weight</th><th>Waist</th></tr>';
  b.slice(-7).reverse().forEach(function(x){h+='<tr><td>'+fmt(x.d)+'</td><td>'+(x.w||"-")+'</td><td>'+(x.waist||"-")+'</td></tr>'});
  return h+'</table></div>';
}
function setup(){
  return '<h1>Setup</h1><div class="card"><div class="field"><span>Starting weight (lb)</span><input type="number" inputmode="decimal" id="bw" value="'+S.bw+'"></div><div class="field"><span>Protein per lb (g)</span><input type="number" inputmode="decimal" step="0.1" id="ppl" value="'+S.ppl+'"></div><div class="field"><b>Daily protein target</b><b id="pt">'+Math.round(S.bw*S.ppl)+' g</b></div><div class="field"><span>Workouts per week goal</span><input type="number" inputmode="numeric" id="goal" value="'+(S.goal||3)+'"></div></div><p class="sub">0.7-1 g per lb is the usual range for building muscle.</p><h2>Add to home screen</h2><div class="card"><ul><li><b>iPhone:</b> open this page in Safari, tap the Share button, then Add to Home Screen.</li><li><b>Android:</b> in Chrome, tap the menu, then Add to Home screen.</li><li>On iPhone a home screen shortcut may start with empty data. Export your backup first, then Import it inside the shortcut.</li></ul></div><h2>Backup</h2><p class="sub">Export copies all your data as text. Save it somewhere safe. To restore, paste it in the box and tap Import.</p><textarea id="bk" rows="4" style="width:100%;box-sizing:border-box;font-size:13px"></textarea><div class="inp" style="margin-top:8px"><button class="save" style="flex:1" data-exp="1">Export</button><button class="save" style="flex:1" data-imp="1">Import</button></div><p class="sub" id="bm"></p><button class="reset" id="reset">'+(armed?"Tap again to erase everything":"Erase all data")+'</button>';
}
function render(){
  document.getElementById("app").innerHTML={work:work,plan:plantab,prog:prog,hist:hist,body:body,set:setup}[tab]();
  var n=[["work","Workout"],["plan","Plan"],["prog","Progress"],["hist","History"],["body","Body"],["set","Setup"]],h="";
  n.forEach(function(t){h+='<button data-tab="'+t[0]+'"'+(t[0]===tab?' class="on"':"")+'>'+t[1]+'</button>'});
  document.getElementById("nav").innerHTML=h;
}
function rest(sec){
  clearInterval(tmr);var end=Date.now()+sec*1000,t=document.getElementById("timer"),sp=t.firstChild;t.hidden=false;
  function tick(){var l=Math.round((end-Date.now())/1000);
    if(l<=0){clearInterval(tmr);sp.textContent="Rest over. Next set!";try{navigator.vibrate(300)}catch(e){}setTimeout(function(){t.hidden=true},6000);return}
    sp.textContent="Rest "+Math.floor(l/60)+":"+String(l%60).padStart(2,"0")}
  tick();tmr=setInterval(tick,500);
}
function $(id){return document.getElementById(id)}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var D=b.dataset;
  if(D.tab){tab=D.tab;armed=false;render();window.scrollTo(0,0)}
  else if(D.day){sel=D.day;render()}
  else if(D.add!==undefined||D.less!==undefined){
    var ix=+(D.add!==undefined?D.add:D.less),xx=exList(sel)[ix],box=$("rows"+ix),cnt=box.children.length;
    if(D.add!==undefined){cnt++;box.insertAdjacentHTML("beforeend",rowHtml(ix,cnt-1,unit(xx[0]),{}))}
    else if(cnt>1){cnt--;box.removeChild(box.lastElementChild)}else return;
    S.setn=S.setn||{};S.setn[xx[0]]=cnt;save();
  }
  else if(D.more){hN+=30;render()}
  else if(D.swap!==undefined){var sx=exList(sel)[+D.swap],og=sx[5]||sx[0],bx=$("sw"+D.swap);
    if(bx.innerHTML){bx.innerHTML="";return}
    bx.innerHTML='<div class="inp" style="flex-wrap:wrap;margin-bottom:8px">'+(ALT[og]||[]).map(function(a){return '<button class="chip" style="flex:0 0 auto;padding:8px 12px" data-pick="'+a+'" data-orig="'+og+'">'+a+'</button>'}).join("")+'</div>'}
  else if(D.pick){S.swap=S.swap||{};S.swap[D.orig]=D.pick;save();render()}
  else if(D.undo){if(S.swap)delete S.swap[D.undo];save();render()}
  else if(D.open){cur=D.open;sel=dayOf(D.ex);tab="work";render();window.scrollTo(0,0)}
  else if(D.skip){clearInterval(tmr);$("timer").hidden=true}
  else if(D.save!==undefined){
    var i=+D.save,ex=exList(sel)[i],ss=[];
    for(var k=0;$("w"+i+"_"+k);k++){var w=parseFloat($("w"+i+"_"+k).value),re=$("r"+i+"_"+k),r=re?parseInt(re.value):NaN;
      if(!isNaN(w)&&w>=0)ss.push({w:w,r:isNaN(r)?null:r})}
    if(!ss.length){$("w"+i+"_0").focus();return}
    var l=(S.log[ex[0]]||[]).filter(function(x){return x.d!==cur});var old=l.filter(function(x){return x.d<cur}),pr=old.length>0&&best1({sets:ss})>Math.max.apply(null,old.map(best1));l.push({d:cur,sets:ss,pr:pr});l.sort(function(a,c){return a.d<c.d?-1:1});
    S.log[ex[0]]=l;save();$("l"+i).innerHTML=info(ex);
    b.textContent=pr?"New PR! 🏆":"Saved";b.classList.add("done");setTimeout(function(){b.classList.remove("done");b.textContent="Update"},pr?3000:1200);
    var P=parse(ex[1]);rest(P.r?(P.r<=8?150:P.r<=10?120:75):90);
  }
  else if(D.bsave){
    var d=$("bd").value||TODAY,w=parseFloat($("bwt").value),wa=parseFloat($("bwa").value);
    if(isNaN(w)&&isNaN(wa))return;
    var old=S.body.filter(function(x){return x.d===d})[0]||{d:d};
    if(!isNaN(w))old.w=w;if(!isNaN(wa))old.waist=wa;
    S.body=S.body.filter(function(x){return x.d!==d}).concat([old]);save();render();
  }
  else if(b.id==="addx"){
    var nm=$("nn").value.replace(/[<>"&]/g,"").trim();if(!nm){$("nn").focus();return}
    if(!exList(sel).some(function(x){return x[0].toLowerCase()===nm.toLowerCase()}))S.extra[sel]=(S.extra[sel]||[]).concat([nm]);
    save();render();
  }
  else if(D.rm){S.extra[sel]=(S.extra[sel]||[]).filter(function(x){return x!==D.rm});save();render()}
  else if(D.exp){var bk=$("bk");bk.value=JSON.stringify(S);bk.select();try{navigator.clipboard.writeText(bk.value);$("bm").textContent="Exported and copied. Paste it into Notes to keep it."}catch(x){$("bm").textContent="Exported. Select the text and copy it."}}
  else if(D.imp){try{var q=JSON.parse($("bk").value);if(!q||!q.log)throw 1;S=q;S.extra=S.extra||{};S.body=S.body||[];save();$("bm").textContent="Imported."}catch(x){$("bm").textContent="That doesn’t look like a valid backup."}}
  else if(b.id==="reset"){if(!armed){armed=true;render()}else{S={log:{},extra:{},body:[],bw:170,ppl:0.8};save();armed=false;render()}}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="dt"&&t.value){cur=t.value;sel=PL[wd(cur)]||sel;render()}
  else if(t.id==="pk"){pick=t.value;render()}
});
document.addEventListener("input",function(e){
  if(e.target.id==="pcw"||e.target.id==="pcb")plates();
  if(e.target.id==="goal"){var gg=parseInt(e.target.value);if(gg>0&&gg<8){S.goal=gg;save()}}
  if(e.target.id==="bw"||e.target.id==="ppl"){
    var a=parseFloat($("bw").value),c=parseFloat($("ppl").value);
    if(a>0)S.bw=a;if(c>0)S.ppl=c;save();$("pt").textContent=Math.round(S.bw*S.ppl)+" g";
  }
});
render();
</script>
